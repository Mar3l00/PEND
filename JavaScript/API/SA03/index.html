<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

    <section id="principal">

        <h1>Buscar Clima</h1>

        <h2>Pesquise o tempo em qualquer lugar do mundo</h2>

        <p class="aviso">
            Digite uma cidade, região ou país para consultar o clima.
            <br>
            Ao pesquisar um país, o sistema pode retornar uma localização
            representativa daquele território.
        </p>

        <div id="busca">

            <input type="text" id="tempo" placeholder="Ex: São Paulo, Londres, Tóquio...">

            <button id="buscar">🔎 Buscar</button>

        </div>

    </section>


    <section id="resultado"></section>

</main>

<footer>
    <p>Dados meteorológicos fornecidos pela Open-Meteo </p>
</footer>

    <script src="script.js"></script>
</body>
</html>
