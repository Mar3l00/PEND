<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produto</title>
</head>
<body>
    <h1>Cadastrar Produto</h1>

    <input id="nome" type="text" placeholder="Digite o nome do produto">

    <input id="preco" type="text" placeholder="Digite o preço do produto">

    <input id="categoria" type="text" placeholder="Digite a categoria do produto">

    <input id="desconto" type="text" placeholder="Digite o desconto do produto">

    <button id="botaoCadastrar">Cadastrar</button>

    <div id="resultado"></div>

    <script src="AtividadeWebStorage.js"></script>
</body>
</html>
